version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-container
    restart: always

    environment:
      - MYSQL_ROOT_PASSWORD=n3u3da!
      - MYSQL_DATABASE=txnmonitor

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/data

    networks:
      - springboot-network

  springboot-app:
    build: .
    container_name: springboot-app

    ports:
      - "8081:8081"

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/txnmonitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: n3u3da!

    networks:
      - springboot-network

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-reachable API URL (baked into the JS bundle).
        # Local compose default: localhost. On the VM override, e.g.:
        #   docker compose build --build-arg VITE_API_BASE_URL=http://<VM_IP>:8081 frontend
        # or set VITE_API_BASE_URL in the environment / .env next to this file.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    container_name: txnmonitor-frontend
    restart: always

    ports:
      - "8082:80"

    depends_on:
      - springboot-app

    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network:
    driver: bridge
