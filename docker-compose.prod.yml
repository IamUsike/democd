# Production-like deploy: app VM runs API + RabbitMQ + frontend;
# MySQL runs on a separate DB VM. Set DB_URL to the remote host.
#
# Usage:
#   DB_URL=jdbc:mysql://<DB_VM_IP>:3306/txnmonitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC \
#     docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-container
    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - springboot-network

  springboot-app:
    build: .
    container_name: springboot-app

    ports:
      - "8081:8081"

    depends_on:
      - rabbitmq

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:?Set DB_URL to the dedicated MySQL VM JDBC URL}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:?Set DB_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq

    networks:
      - springboot-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    container_name: txnmonitor-frontend
    restart: always

    ports:
      - "8082:80"

    depends_on:
      - springboot-app

    networks:
      - springboot-network

networks:
  springboot-network:
    driver: bridge
